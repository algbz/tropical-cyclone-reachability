name: Finalize reproduction figures

on:
  push:
    paths:
      - '.github/workflows/finalize-figures.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pandas scipy matplotlib
      - name: Regenerate figures
        run: |
          rm -rf figures
          python simulation_code.py --check
          python simulation_code.py
      - name: Commit figures and remove temporary workflow
        run: |
          rm .github/workflows/finalize-figures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures .github/workflows/finalize-figures.yml
          git commit -m "Add reproducibility figures"
          git push
